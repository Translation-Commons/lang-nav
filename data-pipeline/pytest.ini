[pytest]
testpaths = tests
python_files = test_*.py

# The langsmith pytest plugin ships with some Anaconda environments and fails
# at import time when pydantic and pydantic-core versions disagree. It has
# nothing to do with this project, so it is disabled here rather than requiring
# every developer to repair an unrelated dependency.
addopts = -p no:langsmith_plugin -q
